[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lukio-runko"
version = "0.5.1"
description = "Shared engine that builds a static site for a Finnish upper secondary school (lukio) subject from its subject.yaml"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = ["Markdown>=3.5", "PyYAML>=6.0"]

[project.optional-dependencies]
images = ["Pillow>=10", "requests"]
dev = ["pytest>=8", "ruff>=0.5", "Pillow>=10"]

[project.scripts]
lukio-runko = "lukio_runko.cli:main"

[project.urls]
Source = "https://github.com/sheikkinen/lukio-runko"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lukio_runko = ["templates/*.html", "assets/css/*.css", "assets/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py313"
extend-exclude = ["_site", "tmp", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Finnish text and typographic characters are intended

[tool.ruff.lint.isort]
known-first-party = ["lukio_runko"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
